name: Bug report
description: Report a reproducible issue with X Trend Scout.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command, endpoint, or mode you ran.
      placeholder: |
        1. Run `make fresh`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Remove API keys, tokens, cookies, local paths you do not want public, and generated private content before posting.
      render: shell
