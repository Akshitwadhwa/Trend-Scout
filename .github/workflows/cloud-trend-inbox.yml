name: Cloud Trend Inbox

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-trend-inbox
  cancel-in-progress: false

jobs:
  collect-free-trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh free trend inbox
        env:
          ENABLE_OPENAI_RESEARCH: "false"
          ENABLE_OPENAI_DRAFTS: "false"
          ENABLE_SCHEDULER: "false"
          ENABLE_X_SCAN: "false"
          ENABLE_X_WATCHLIST: "false"
          ENABLE_X_TIMELINE: "false"
        run: python scripts/cloud_trend_cycle.py

      - name: Commit updated trend inbox
        run: |
          git config user.name "trend-scout-bot"
          git config user.email "trend-scout-bot@users.noreply.github.com"
          git add data/trend-inbox.json data/trend-inbox.md
          git diff --cached --quiet || git commit -m "Update cloud trend inbox"
          git push
