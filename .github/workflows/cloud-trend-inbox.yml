name: Cloud Trend Inbox

on:
  schedule:
    # 08:00 India Standard Time (UTC+05:30): morning model/tool launch scan.
    - cron: "30 2 * * *"
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-trend-inbox
  cancel-in-progress: false

jobs:
  collect-free-trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh free trend inbox
        env:
          # Paid research remains opt-in: add OPENAI_API_KEY to repository
          # secrets to enable it. Without it, this stays a free RSS/API scan.
          ENABLE_OPENAI_RESEARCH: ${{ secrets.OPENAI_API_KEY != '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_TIMEOUT_SECONDS: "90"
          GITHUB_TOKEN: ${{ github.token }}
          ENABLE_OPENAI_DRAFTS: "false"
          ENABLE_SCHEDULER: "false"
          # X is optional: enable the repository variable only after adding
          # an X_BEARER_TOKEN secret. Social posts are discovery-only and
          # still need official/reputable corroboration to reach drafts.
          ENABLE_X_SCAN: ${{ secrets.X_BEARER_TOKEN != '' && vars.ENABLE_X_SCAN == 'true' }}
          ENABLE_X_WATCHLIST: ${{ secrets.X_BEARER_TOKEN != '' && vars.ENABLE_X_WATCHLIST == 'true' }}
          ENABLE_X_TIMELINE: "false"
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_WATCH_HANDLES: ${{ vars.X_WATCH_HANDLES }}
        run: python scripts/cloud_trend_cycle.py

      - name: Commit updated trend inbox
        run: |
          git config user.name "trend-scout-bot"
          git config user.email "trend-scout-bot@users.noreply.github.com"
          git add data/trend-inbox.json data/trend-inbox.md
          git diff --cached --quiet || git commit -m "Update cloud trend inbox"
          git push
