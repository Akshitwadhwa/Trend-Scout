[project]
name = "x-ai-whatsapp-bot"
version = "0.1.0"
description = "A FastAPI service that scans X and web feeds, finds timely tech content angles, and generates copy-paste-ready posts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler==3.10.4",
    "fastapi==0.116.1",
    "openai==1.99.9",
    "python-dotenv==1.1.1",
    "requests==2.32.4",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
