<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How an AI-assisted X content workflow works</title>
  <desc id="desc">A simple flow from trusted sources to research, Hermes, Telegram, human review, and posting or replying on X. Feedback returns to Hermes to improve future drafts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a29"/>
      <stop offset="1" stop-color="#071015"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33d8ff"/>
      <stop offset="1" stop-color="#747cff"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 10 6 L 0 12 z" fill="#65dfff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="170" cy="120" r="270" fill="#143b57" opacity=".22"/>
  <circle cx="1450" cy="750" r="320" fill="#262f77" opacity=".22"/>
  <path d="M0 710 C330 620 450 835 770 730 S1260 580 1600 700" fill="none" stroke="#a2c9da" stroke-opacity=".08" stroke-width="2"/>

  <text x="800" y="111" text-anchor="middle" fill="#f5fbff" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">How an AI-assisted X content workflow works</text>
  <text x="800" y="158" text-anchor="middle" fill="#a9c0cb" font-family="Arial, Helvetica, sans-serif" font-size="23">Research → draft → review → post → improve</text>

  <!-- Main flow line -->
  <path d="M258 407 H336" stroke="#65dfff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M514 407 H592" stroke="#65dfff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M770 407 H848" stroke="#65dfff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1026 407 H1104" stroke="#65dfff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1282 407 H1360" stroke="#65dfff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Source -->
  <g filter="url(#shadow)">
    <rect x="80" y="290" width="178" height="234" rx="24" fill="#132538" stroke="#2a5973" stroke-width="2"/>
    <circle cx="169" cy="351" r="32" fill="#1f4b67"/>
    <path d="M153 340h31v21h-31zM153 369h22" fill="none" stroke="#9ceaff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="169" y="425" text-anchor="middle" fill="#f5fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Trusted</text>
    <text x="169" y="454" text-anchor="middle" fill="#f5fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">tech sources</text>
    <text x="169" y="488" text-anchor="middle" fill="#a9c0cb" font-family="Arial, Helvetica, sans-serif" font-size="16">Official news,</text>
    <text x="169" y="510" text-anchor="middle" fill="#a9c0cb" font-family="Arial, Helvetica, sans-serif" font-size="16">product updates</text>
  </g>

  <!-- Verify -->
  <g filter="url(#shadow)">
    <rect x="336" y="290" width="178" height="234" rx="24" fill="#132538" stroke="#2a5973" stroke-width="2"/>
    <circle cx="425" cy="351" r="32" fill="#1f4b67"/>
    <path d="M409 351l11 11 23-25" fill="none" stroke="#9ceaff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="425" y="425" text-anchor="middle" fill="#f5fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Research +</text>
    <text x="425" y="454" text-anchor="middle" fill="#f5fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">fact-check</text>
    <text x="425" y="488" text-anchor="middle" fill="#a9c0cb" font-family="Arial, Helvetica, sans-serif" font-size="16">Keep only</text>
    <text x="425" y="510" text-anchor="middle" fill="#a9c0cb" font-family="Arial, Helvetica, sans-serif" font-size="16">supported claims</text>
  </g>

  <!-- Hermes -->
  <g filter="url(#shadow)">
    <rect x="592" y="270" width="178" height="274" rx="24" fill="url(#accent)"/>
    <circle cx="681" cy="341" r="34" fill="#ffffff" fill-opacity=".92"/>
    <path d="M665 350c0-19 9-29 16-29s16 10 16 29M660 354h42M672 365h18" fill="none" stroke="#1c3a58" stroke-width="5" stroke-linecap="round"/>
    <text x="681" y="425" text-anchor="middle" fill="#071a2a" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Hermes</text>
    <text x="681" y="458" text-anchor="middle" fill="#071a2a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Local AI assistant</text>
    <text x="681" y="493" text-anchor="middle" fill="#133149" font-family="Arial, Helvetica, sans-serif" font-size="16">Turns facts into</text>
    <text x="681" y="515" text-anchor="middle" fill="#133149" font-family="Arial, Helvetica, sans-serif" font-size="16">clear draft posts</text>
  </g>

  <!-- Telegram -->
  <g filter="url(#shadow)">
    <rect x="848" y="290" width="178" height="234" rx="24" fill="#132538" stroke="#2a5973" stroke-width="2"/>
    <circle cx="937" cy="351" r="32" fill="#258ac6"/>
    <path d="M916 347l43-18-13 43-13-15-17-10z" fill="#ffffff"/>
    <path d="M933 357l26-28" stroke="#258ac6" stroke-width="3"/>
    <text x="937" y="425" text-anchor="middle" fill="#f5fbff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Telegram</text>
    <text x="937" y="488" text-anchor="middle" fill="#a9c0cb" font-family="Arial, Helvetica, sans-serif" font-size="16">One draft per</text>
    <text x="937" y="510" text-anchor="middle" fill="#a9c0cb" font-family="Arial, Helvetica, sans-serif" font-size="16">message to copy</text>
  </g>

  <!-- Human -->
  <g filter="url(#shadow)">
    <rect x="1104" y="290" width="178" height="234" rx="24" fill="#132538" stroke="#2a5973" stroke-width="2"/>
    <circle cx="1193" cy="351" r="32" fill="#1f4b67"/>
    <circle cx="1193" cy="341" r="10" fill="none" stroke="#9ceaff" stroke-width="5"/>
    <path d="M1173 371c4-13 13-19 20-19s16 6 20 19" fill="none" stroke="#9ceaff" stroke-width="5" stroke-linecap="round"/>
    <text x="1193" y="425" text-anchor="middle" fill="#f5fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">You review</text>
    <text x="1193" y="454" text-anchor="middle" fill="#f5fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">and edit</text>
    <text x="1193" y="488" text-anchor="middle" fill="#a9c0cb" font-family="Arial, Helvetica, sans-serif" font-size="16">Your voice stays</text>
    <text x="1193" y="510" text-anchor="middle" fill="#a9c0cb" font-family="Arial, Helvetica, sans-serif" font-size="16">in control</text>
  </g>

  <!-- X -->
  <g filter="url(#shadow)">
    <rect x="1360" y="290" width="178" height="234" rx="24" fill="#132538" stroke="#2a5973" stroke-width="2"/>
    <circle cx="1449" cy="351" r="32" fill="#f5fbff"/>
    <path d="M1434 333l31 37M1465 333l-31 37" stroke="#102032" stroke-width="6" stroke-linecap="round"/>
    <text x="1449" y="425" text-anchor="middle" fill="#f5fbff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Post on X</text>
    <text x="1449" y="488" text-anchor="middle" fill="#a9c0cb" font-family="Arial, Helvetica, sans-serif" font-size="16">Post, reply or</text>
    <text x="1449" y="510" text-anchor="middle" fill="#a9c0cb" font-family="Arial, Helvetica, sans-serif" font-size="16">quote repost</text>
  </g>

  <!-- Feedback loop -->
  <path d="M1193 586 C1193 732 681 732 681 586" fill="none" stroke="#97b7c6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="592" y="681" width="202" height="52" rx="26" fill="#1a3447" stroke="#3c7189" stroke-width="1"/>
  <text x="693" y="714" text-anchor="middle" fill="#d7f3ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Feedback improves future drafts</text>

  <text x="800" y="826" text-anchor="middle" fill="#8faebb" font-family="Arial, Helvetica, sans-serif" font-size="20">Local workflow • Final review stays with you</text>
</svg>
